<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Lab · Murdoku</title>
<link rel="icon" href="../favicon.svg">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4ecdd;
         color: #102725; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 30rem; margin: 24px 16px; padding: 28px; border-radius: 20px; background: #fbf7ee;
         box-shadow: 0 12px 30px #3a2a1522; text-align: center; }
  h1 { font: 600 26px/1.2 Georgia, serif; margin: 12px 0 8px; }
  p { margin: 0 0 18px; color: #3b4b48; }
  a { display: inline-block; margin: 4px; padding: 10px 18px; border-radius: 12px; font-weight: 700;
      text-decoration: none; }
  .go { background: #0b7469; color: #fff; }
  .back { background: #ece2cc; color: #102725; }
</style>
</head>
<body>
<main>
  <img src="../brand/mascot-thinking.svg" width="96" height="96" alt="">
  <h1>The research Lab lives next door</h1>
  <p>This preview is the game. The research Lab, with the solver tools and exports, is the existing Murdoku Lab casebook.</p>
  <a class="go" href="{LAB}">Open the research Lab</a>
  <a class="back" href="../">Back to the cases</a>
</main>

</html>
